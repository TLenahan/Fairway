<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fairway Hub</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --dim: #8b949e;
        --green: #3fb950;
        --amber: #d29922;
        --red: #f85149;
        --accent: #2f81f7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 -apple-system, 'SF Pro Text', Helvetica, sans-serif;
      }
      #root { max-width: 980px; margin: 0 auto; padding: 16px; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 12px;
      }
      .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
      .dim { color: var(--dim); }
      button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 12px;
        font: inherit;
        cursor: pointer;
      }
      button:hover { border-color: var(--dim); }
      button.primary { background: var(--accent); border-color: var(--accent); }
      button.active { background: var(--accent); border-color: var(--accent); }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--border); }
      th { color: var(--dim); font-weight: 500; }
      th:first-child, td:first-child { text-align: left; }
      td.discarded { text-decoration: line-through; opacity: 0.45; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); margin: 0 0 10px; }
      h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); font-weight: 500; margin: 14px 0 6px; }
      .good { color: var(--green); }
      .warn { color: var(--amber); }
      .bad { color: var(--red); }
      ul.findings { list-style: none; margin: 0; padding: 0; }
      ul.findings li { padding: 5px 0; border-bottom: 1px solid var(--border); }
      ul.findings li:last-child { border-bottom: none; }
      .who { color: var(--accent); }
      ul.blocks { list-style: none; margin: 0; padding: 0; }
      ul.blocks li { padding: 8px 0; border-bottom: 1px solid var(--border); }
      ul.blocks li:last-child { border-bottom: none; }
      /* the loop's verdicts are context, not the work in front of you */
      ul.blocks li.resolved { opacity: 0.62; }
      /* protocol is available, not shouting */
      .protocol { margin-top: 2px; font-size: 13px; }
      /* the coach's own one-line answer leads the panel */
      .recap-headline { font-size: 16px; line-height: 1.35; margin-bottom: 8px; }
      /* pre-line keeps the single newlines the coach uses inside a paragraph;
         blank-line breaks are already separate <p> elements */
      .recap-prose p { margin: 0 0 9px; white-space: pre-line; }
      .recap-prose p:last-child { margin-bottom: 0; }
      ul.recap { list-style: none; margin: 0; padding: 0; }
      ul.recap li { padding: 6px 0; border-bottom: 1px solid var(--border); }
      ul.recap li:last-child { border-bottom: none; }
      .severity { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
      .recap-footer { margin-top: 12px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/renderer.js"></script>
  </body>
</html>
